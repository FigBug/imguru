name: imguru
on: [push, pull_request]

jobs:
  build:
    name: imguru
    timeout-minutes: 60
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: "Run script"
        run: ./ci/mac/build.sh
        shell: bash
        env:
          APPLICATION: ${{ secrets.APPLICATION }}
          INSTALLER: ${{ secrets.INSTALLER }}
          APPLE_PASS: ${{ secrets.APPLE_PASS }}
          APPLE_USER: ${{ secrets.APPLE_USER }}
          IMGUR_SECRET: ${{ secrets.IMGUR_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: imguru
          path: ci/mac/bin
          retention-days: 3
      - name: "Publish release"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ci/mac/bin/imguru.zip --clobber
          else
            gh release create "$TAG" ci/mac/bin/imguru.zip --title "$TAG" --generate-notes
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
